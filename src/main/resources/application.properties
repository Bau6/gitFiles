spring.application.name=gitFiles
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/vcs_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=vcs_user
spring.datasource.password=vcs_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=mySuperSecretKeyForJWTTokenGeneration2024WithAtLeast32Bytes!
jwt.expiration=86400000
spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

file.storage.path=./storage

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html